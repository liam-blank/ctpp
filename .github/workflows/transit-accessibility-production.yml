name: Transit Accessibility Production
on:
  push:
    branches:
      - transit-accessibility-production-20260812
    paths:
      - '.github/workflows/transit-accessibility-production.yml'
      - 'transit_accessibility_pipeline.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install analytical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.3 numpy==2.2.6 scipy==1.15.3 geopandas==1.0.1 shapely==2.0.7 pyogrio==0.10.0 pyarrow==19.0.1 pyproj==3.7.1 requests==2.32.3 holidays==0.69 osmium==4.0.2 tqdm==4.67.1
      - name: Run production pipeline
        env:
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '4'
        run: python transit_accessibility_pipeline.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-accessibility-production
          path: transit_accessibility_output/
          compression-level: 0
          retention-days: 7
