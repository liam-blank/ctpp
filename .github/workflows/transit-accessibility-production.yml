name: Transit Accessibility Production
on:
  push:
    branches:
      - transit-accessibility-production-20260812
    paths:
      - '.github/workflows/transit-accessibility-production.yml'
      - 'transit_accessibility_pipeline.py'
      - 'score_input.csv.gz.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.3 requests==2.32.3
      - name: Acquire production source data
        env:
          PYTHONUNBUFFERED: '1'
        run: python transit_accessibility_pipeline.py
      - name: Upload Census and LODES sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-accessibility-core
          path: transit_accessibility_output/core/
          compression-level: 0
          retention-days: 7
      - name: Upload OpenStreetMap source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-accessibility-osm
          path: transit_accessibility_output/osm/
          compression-level: 0
          retention-days: 7
      - name: Upload GTFS sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-accessibility-gtfs
          path: transit_accessibility_output/gtfs/
          compression-level: 0
          retention-days: 7
      - name: Upload acquisition inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-accessibility-metadata
          path: transit_accessibility_output/metadata/
          compression-level: 0
          retention-days: 7
